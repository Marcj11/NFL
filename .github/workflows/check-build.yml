name: Build check
on:
  push:
    branches: [feature/live-model-preview-ui]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build
  nhl_source_audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 4
    steps:
      - name: Probe NHL MoneyPuck CSV header
        shell: python
        run: |
          import csv,io,json,urllib.request
          u='https://moneypuck.com/moneypuck/playerData/seasonSummary/2024/regular/skaters.csv'
          try:
              q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Range':'bytes=0-16383'})
              with urllib.request.urlopen(q,timeout=20) as r: data=r.read(16384).decode('utf-8-sig','replace');status=r.status
              lines=data.splitlines()[:4]
              rows=list(csv.reader(io.StringIO('\n'.join(lines))))
              cols=rows[0] if rows else []
              print(json.dumps({'result':'success','http_status':status,'column_count':len(cols),'sample_rows':max(0,len(rows)-1),'rows':[dict(zip(cols,row)) for row in rows[1:3] if len(row)==len(cols)],'db_writes':0}))
          except Exception as e:
              print(json.dumps({'result':'unavailable','reason':str(e),'db_writes':0}))
              raise
  nhl_staging_samples:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Collect verified small NHL sample for connector import
        shell: python
        run: |
          import csv,json,urllib.request
          for season in ('2023','2024','2025'):
              for dataset in ('skaters','goalies','teams'):
                  url=f'https://moneypuck.com/moneypuck/playerData/seasonSummary/{season}/regular/{dataset}.csv'
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req,timeout=50) as response:
                          reader=csv.DictReader((line.decode('utf-8-sig') for line in response))
                          rows=[]
                          for row in reader:
                              rows.append(row)
                              if len(rows)==2:break
                      print('NHL_SAMPLE '+json.dumps({'season':season,'dataset':dataset,'rows':rows},separators=(',',':')),flush=True)
                  except Exception as e:
                      print('NHL_SAMPLE_ERROR '+json.dumps({'season':season,'dataset':dataset,'error':str(e)[:200]}),flush=True)
