name: Compact FTN play charting 2023
on:
  push:
    paths:
      - '.github/workflows/compact-ftn-2023.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NFL_SEASON: '2023'
      NFL_COMPACT_SUPABASE_URL: ${{ secrets.NFL_COMPACT_SUPABASE_URL }}
      NFL_COMPACT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NFL_COMPACT_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nflreadpy polars supabase
      - id: load
        continue-on-error: true
        run: python scripts/import_ftn_compact.py > ftn.log 2>&1
      - if: always()
        run: |
          mkdir -p diagnostics
          cp ftn.log diagnostics/compact-ftn-2023.log
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add diagnostics/compact-ftn-2023.log
          git diff --cached --quiet || (git commit -m 'Record FTN 2023 import result' && git pull --rebase && git push)
      - if: steps.load.outcome == 'failure'
        run: exit 1
