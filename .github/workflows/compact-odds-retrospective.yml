name: NFL compact retrospective odds
on:
  push:
    paths:
      - '.github/workflows/compact-odds-retrospective.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NFL_COMPACT_SUPABASE_URL: ${{ secrets.NFL_COMPACT_SUPABASE_URL }}
      NFL_COMPACT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NFL_COMPACT_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nflreadpy polars supabase
      - id: import
        continue-on-error: true
        run: python scripts/import_odds_retrospective.py > odds.log 2>&1
      - if: always()
        run: |
          mkdir -p diagnostics
          cp odds.log diagnostics/compact-odds-retrospective.log
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add diagnostics/compact-odds-retrospective.log
          git diff --cached --quiet || (git commit -m 'Record odds retrospective import' && git pull --rebase && git push)
      - if: steps.import.outcome == 'failure'
        run: exit 1
