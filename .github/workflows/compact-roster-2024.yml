name: Compact roster 2024
on:
  push:
    paths:
      - '.github/workflows/compact-roster-2024.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NFL_SEASON: '2024'
      NFL_COMPACT_SUPABASE_URL: ${{ secrets.NFL_COMPACT_SUPABASE_URL }}
      NFL_COMPACT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NFL_COMPACT_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nflreadpy polars supabase
      - name: Import
        id: load
        continue-on-error: true
        run: python scripts/import_compact_rosters.py > roster.log 2>&1
      - name: Record result
        if: always()
        run: |
          python -c "import json,pathlib; pathlib.Path('diagnostics/compact-roster-2024.json').write_text(json.dumps({'log_tail':pathlib.Path('roster.log').read_text()[-2500:]}))"
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add diagnostics/compact-roster-2024.json
          git diff --cached --quiet || (git commit -m 'Record roster diagnostic' && git pull --rebase && git push)
      - if: steps.load.outcome == 'failure'
        run: exit 1
