name: Engine C injury check
on:
  push:
    branches: [feature/nhl-nfl-component-parity]
    paths: ['scripts/injury_engine_preview.py', '.github/workflows/engine-c-injury-test.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/injury_engine_preview.py
      - run: pip install supabase
      - name: Run read-only Engine C integration
        env:
          NFL_SUPABASE_URL: ${{ secrets.NFL_SUPABASE_URL }}
          NFL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NFL_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/injury_engine_preview.py
