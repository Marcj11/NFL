name: Import kickers
on:
  push:
    branches: [feature/nhl-nfl-component-parity]
    paths: [scripts/import_kicker_weekly.py, .github/workflows/import-kickers.yml]
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * *'
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install supabase
      - run: python scripts/import_kicker_weekly.py
        env:
          NFL_SUPABASE_URL: ${{ secrets.NFL_SUPABASE_URL }}
          NFL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NFL_SUPABASE_SERVICE_ROLE_KEY }}
