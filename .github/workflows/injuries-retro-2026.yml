name: NFL retrospective injuries 2026
on:
  push:
    paths:
      - '.github/workflows/injuries-retro-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NFL_SEASON: '2026'
      NFL_COMPACT_SUPABASE_URL: ${{ secrets.NFL_COMPACT_SUPABASE_URL }}
      NFL_COMPACT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NFL_COMPACT_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nflreadpy polars supabase
      - id: load
        continue-on-error: true
        run: python scripts/import_injuries_retrospective.py > injuries.log 2>&1
      - if: always()
        run: |
          python -c "import pathlib,json;pathlib.Path('diagnostics/injuries-retro-2026.json').write_text(json.dumps({'log_tail':pathlib.Path('injuries.log').read_text()[-2500:]}))"
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add diagnostics/injuries-retro-2026.json
          git diff --cached --quiet || (git commit -m 'Record injury 2026 result' && git pull --rebase && git push)
      - if: steps.load.outcome == 'failure'
        run: exit 1
