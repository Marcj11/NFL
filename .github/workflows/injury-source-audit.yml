name: Injury source audit
on:
  push:
    paths:
      - '.github/workflows/injury-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nflreadpy polars
      - run: python scripts/audit_injury_source.py > injury.log 2>&1
      - run: |
          mkdir -p diagnostics
          cp injury.log diagnostics/injury-source-audit.log
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add diagnostics/injury-source-audit.log
          git diff --cached --quiet || (git commit -m 'Record injury schema check' && git pull --rebase && git push)
