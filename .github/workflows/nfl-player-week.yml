name: NFL player-team-week coverage
on:
  push:
    paths:
      - 'scripts/check_player_team_week.py'
      - '.github/workflows/nfl-player-week.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nflreadpy polars
      - run: python scripts/check_player_team_week.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/nflverse-player-team-week.json || true
          git diff --cached --quiet || (git commit -m "Verify NFL player team week joins" && git push)
