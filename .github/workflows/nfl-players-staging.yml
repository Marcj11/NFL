name: NFL player registry staging
on:
  push:
    paths:
      - 'scripts/stage_nfl_players.py'
      - '.github/workflows/nfl-players-staging.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nflreadpy polars
      - run: python scripts/stage_nfl_players.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/staged-nfl-players.json
          git diff --cached --quiet || (git commit -m "Stage NFL player identities" && git push)
