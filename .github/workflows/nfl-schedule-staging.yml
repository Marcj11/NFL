name: NFL schedule import staging
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nfl-schedule-staging.yml'
      - 'scripts/stage_nfl_schedules.py'
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nflreadpy polars
      - run: python scripts/stage_nfl_schedules.py
      - name: Commit structured source data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/nflverse-schedule-staging.json
          git diff --cached --quiet || (git commit -m "Stage verified-source NFL schedules for Supabase" && git push)
