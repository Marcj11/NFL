name: NFL Supabase write verification
on:
  push:
    paths:
      - '.github/workflows/nfl-supabase-write-verification.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NFL_SEASON: '2024'
      NFL_IMPORT_COMMIT: 'true'
      SUPABASE_URL: ${{ secrets.NFL_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NFL_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nflreadpy polars supabase
      - name: Import and validate one season
        run: |
          python scripts/import_nfl_supabase.py > /tmp/nfl-import-result.jsonl
          python - <<'PY'
          import os,json
          from supabase import create_client
          db=create_client(os.environ['SUPABASE_URL'],os.environ['SUPABASE_SERVICE_ROLE_KEY'])
          data=db.table('games').select('game_id',count='exact').eq('season',2024).limit(1).execute()
          count=data.count
          if count!=285:raise RuntimeError(f'Expected 285 games, got {count}')
          with open('diagnostics/supabase-write-verification.json','w') as f:
            json.dump({'season':2024,'verified_games':count,'status':'PASS'},f)
          print('PASS:',count,'schedule rows persisted in Supabase')
          PY
      - name: Preserve verified result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/supabase-write-verification.json
          git diff --cached --quiet || (git commit -m "Record verified Supabase 2024 import" && git push)
