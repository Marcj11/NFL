name: NFL automatic archived player-prop grading
on:
  schedule:
    - cron: '40 13 * * 3'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nfl-player-prop-grading
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nhl-nfl-component-parity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install supabase
      - name: Grade supported archived player props
        env:
          NFL_SUPABASE_URL: ${{ secrets.NFL_SUPABASE_URL }}
          NFL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NFL_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/grade_archived_player_props.py
