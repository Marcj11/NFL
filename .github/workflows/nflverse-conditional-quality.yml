name: NFLverse conditional data quality
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nflverse-conditional-quality.yml'
permissions:
  contents: write
concurrency:
  group: nflverse-conditional-quality
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nflreadpy polars
      - name: Audit 2023-2026
        run: python scripts/audit_nflverse_conditional.py
      - name: Save quality report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/nflverse-conditional-quality.json || true
          git diff --cached --quiet || (git commit -m "Report conditional NFL data quality" && git push)
