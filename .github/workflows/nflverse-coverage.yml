name: NFLverse dataset coverage audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nflverse-coverage.yml'
permissions:
  contents: write
concurrency:
  group: nflverse-coverage
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nflreadpy polars
      - name: Download samples and audit coverage
        run: python scripts/audit_nflverse.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/nflverse-coverage.json || true
          git diff --cached --quiet || (git commit -m "Report dataset coverage 2024-2026" && git push)
