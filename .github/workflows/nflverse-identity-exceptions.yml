name: NFL identity exceptions triage
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/triage_player_ids.py'
      - '.github/workflows/nflverse-identity-exceptions.yml'
permissions:
  contents: write
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nflreadpy polars
      - run: python scripts/triage_player_ids.py
      - name: Commit audit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/nflverse-identity-exceptions.json || true
          git diff --cached --quiet || (git commit -m "Report remaining NFL player identity exceptions" && git push)
