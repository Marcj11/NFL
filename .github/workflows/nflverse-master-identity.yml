name: NFL master player identity audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nflverse-master-identity.yml'
      - 'scripts/audit_nflverse_master_identity.py'
permissions:
  contents: write
concurrency:
  group: nflverse-master-identity
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nflreadpy polars
      - run: python scripts/audit_nflverse_master_identity.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/nflverse-master-identity.json || true
          git diff --cached --quiet || (git commit -m "Audit master PFR GSIS identity coverage" && git push)
