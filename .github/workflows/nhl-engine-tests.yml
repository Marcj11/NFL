name: NHL engine regression tests
on:
  push:
    branches: [feature/nhl-moneypuck-validation]
    paths:
      - 'lib/nhl/engine.ts'
      - 'tests/nhl/engine.test.ts'
      - '.github/workflows/nhl-engine-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Execute regression tests
        run: node --experimental-strip-types --test tests/nhl/engine.test.ts
