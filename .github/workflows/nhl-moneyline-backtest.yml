name: NHL three-season moneyline backtest
on:
  workflow_dispatch:
  push:
    branches: [feature/nhl-moneypuck-validation]
    paths:
      - 'scripts/nhl/moneyline_backtest.py'
      - '.github/workflows/nhl-moneyline-backtest.yml'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce 2023-24 to 2025-26 historical backtest
        run: python scripts/nhl/moneyline_backtest.py
      - name: Publish predictions and verified percentages
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhl-moneyline-backtest-results
          path: artifacts/nhl-moneyline-backtest/
          if-no-files-found: warn
