name: Verify NFL Elo live
on:
  push:
    paths:
      - '.github/workflows/verify-live-elo.yml'
      - 'scripts/live-elo-smoke.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test site and Elo predictions
        env:
          URL: https://nfl-studio-2397r8l7q-marcj-1079.vercel.app
        run: |
          mkdir -p diagnostics
          set +e
          node scripts/live-elo-smoke.mjs > diagnostics/live-elo-smoke.txt 2>&1
          STATUS=$?
          cat diagnostics/live-elo-smoke.txt
          echo "exit_code=$STATUS" >> diagnostics/live-elo-smoke.txt
          exit "$STATUS"
      - name: Save outcome
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/live-elo-smoke.txt
          git diff --cached --quiet || (git commit -m "Save NFL Elo live smoke result" && git push)
